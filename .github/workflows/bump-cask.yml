name: Bump maccopy cask

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Check for new release and bump cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(grep -oP '(?<=version ")[^"]+' Casks/maccopy.rb)
          echo "Current version: $CURRENT_VERSION"

          LATEST_VERSION=$(gh release view --repo maccopy/maccopy --json tagName -q '.tagName' | sed 's/^v//')
          echo "Latest version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "Already up to date."
            exit 0
          fi

          ASSET_URL="https://github.com/maccopy/maccopy/releases/download/v${LATEST_VERSION}/Maccopy.zip"
          echo "Downloading $ASSET_URL"
          curl -fsSL "$ASSET_URL" -o /tmp/Maccopy.zip
          SHA256=$(sha256sum /tmp/Maccopy.zip | awk '{print $1}')
          echo "SHA256: $SHA256"

          sed -i "s/version \"${CURRENT_VERSION}\"/version \"${LATEST_VERSION}\"/" Casks/maccopy.rb
          sed -i "s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${SHA256}\"/" Casks/maccopy.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/maccopy.rb
          git commit -m "chore: bump maccopy to ${LATEST_VERSION}"
          git push
